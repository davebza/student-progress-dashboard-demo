<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212b;font:14px system-ui}main{max-width:1100px;margin:auto;padding:42px}h1{font:42px Georgia;margin-bottom:8px}.sub{color:#66727d}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}.kpi,.panel{background:white;border:1px solid #dde2e6;border-radius:16px;padding:22px}.kpi strong{font-size:32px;display:block}.toolbar{display:flex;gap:8px;margin-bottom:12px}button{border:1px solid #ccd3d8;background:white;border-radius:999px;padding:8px 12px}.active{background:#17212b;color:white}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf0f2}.status{font-weight:700}.Positive{color:#27734a}.Watch{color:#9a6814}.Review{color:#b34b35}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}main{padding:24px}.panel{overflow:auto}}</style></head><body><main><small>PROGRESS SYSTEM · PUBLIC DEMO</small><h1>Learning Progress Dashboard</h1><p class="sub">Synthetic portfolio data · designed for quick intervention decisions</p><div class="kpis" id="kpis"></div><div class="toolbar" id="filters"></div><div class="panel"><table><thead><tr><th>Learner</th><th>Target</th><th>Current</th><th>Trend</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>let data=[],f='All';function draw(){let x=f==='All'?data:data.filter(r=>r.status===f);rows.innerHTML=x.map(r=>'<tr><td>'+r.name+'</td><td>'+r.target+'</td><td>'+r.current+'</td><td>'+r.trend+'</td><td class="status '+r.status+'">'+r.status+'</td></tr>').join('');kpis.innerHTML=[['Learners',data.length],['Positive',data.filter(r=>r.status==='Positive').length],['Watch',data.filter(r=>r.status==='Watch').length],['Review',data.filter(r=>r.status==='Review').length]].map(k=>'<div class="kpi"><span>'+k[0]+'</span><strong>'+k[1]+'</strong></div>').join('')}['All','Positive','Watch','Review'].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{f=v;[...filters.children].forEach(x=>x.classList.toggle('active',x.textContent===v));draw()};if(v==='All')b.className='active';filters.appendChild(b)});google.script.run.withSuccessHandler(d=>{data=d;draw()}).getProgressData();</script></body></html>
